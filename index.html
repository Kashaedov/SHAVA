<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШАВАЛИГА — Клубный Рейтинг</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B1E16] text-slate-100 min-h-screen p-3 md:p-6 font-sans selection:bg-amber-500 selection:text-slate-950">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Шапка -->
    <header class="text-center py-6 border-b border-emerald-800/50 relative">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20 mb-3 border border-amber-300/40">
        🌯
      </div>
      <h1 class="text-3xl md:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 uppercase">ШАВАЛИГА</h1>
      <p class="text-emerald-400/80 text-xs italic mt-1 font-medium">«Каждый вторник — новая проверка»</p>
    </header>

    <!-- Форма оценки -->
    <div class="bg-slate-900/90 backdrop-blur-md p-5 rounded-3xl border border-emerald-800/60 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-xs font-black text-amber-400 uppercase tracking-widest flex items-center gap-2">
          <span>✍️</span> Новая оценка
        </h2>
        <span class="text-[10px] bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700/40 font-bold">Закрытый клуб</span>
      </div>

      <form id="shavaForm" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Название заведения</label>
            <input type="text" id="venueName" placeholder="Дейзи или Шаурма в Пивне" class="w-full bg-slate-950 border border-slate-800/80 p-3 rounded-xl text-sm text-slate-100 placeholder:text-slate-600 outline-none focus:border-amber-400/60" required />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Участник</label>
            <select id="venueAuthor" class="w-full bg-slate-950 border border-slate-800/80 p-3 rounded-xl text-sm text-amber-400 font-black outline-none focus:border-amber-400/60">
              <option value="Виталий">Виталий</option>
              <option value="Дмитрий">Дмитрий</option>
              <option value="Ринат">Ринат</option>
            </select>
          </div>
        </div>

        <!-- Блок Шаурмы -->
        <div class="p-3.5 bg-slate-950/70 rounded-2xl border border-emerald-900/50 space-y-2">
          <div class="font-black text-emerald-400 flex items-center justify-between text-xs">
            <span>🌯 Шаурма</span>
            <span class="text-[10px] text-slate-500 font-normal">Балл от 1 до 10</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="shawaName" placeholder="Вид (Классика...)" class="col-span-2 bg-slate-900 border border-slate-800/80 p-2.5 rounded-xl text-slate-100 outline-none" />
            <input type="number" id="shawaScore" min="1" max="10" value="9" placeholder="1-10" class="bg-slate-900 border border-slate-800/80 p-2.5 rounded-xl text-slate-100 text-center font-black text-amber-400 outline-none" />
          </div>
        </div>

        <!-- Блок Пива -->
        <div class="p-3.5 bg-slate-950/70 rounded-2xl border border-amber-900/30 space-y-2">
          <div class="font-black text-amber-400 flex items-center justify-between text-xs">
            <span>🍺 Пиво</span>
            <span class="text-[10px] text-slate-500 font-normal">Балл от 1 до 10</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="beerName" placeholder="Сорт (Светлое...)" class="col-span-2 bg-slate-900 border border-slate-800/80 p-2.5 rounded-xl text-slate-100 outline-none" />
            <input type="number" id="beerScore" min="1" max="10" value="9" placeholder="1-10" class="bg-slate-900 border border-slate-800/80 p-2.5 rounded-xl text-slate-100 text-center font-black text-amber-400 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-bold">Комментарий вторника</label>
          <input type="text" id="venueComment" placeholder="Соус, мяско, атмосфера..." class="w-full bg-slate-950 border border-slate-800/80 p-3 rounded-xl text-sm text-slate-100 placeholder:text-slate-600 outline-none focus:border-amber-400/60" />
        </div>

        <div id="formStatus" class="text-center font-bold text-xs py-1"></div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-sm transition transform active:scale-[0.99] shadow-lg shadow-amber-500/20">
          Сохранить оценку в облако
        </button>
      </form>
    </div>

    <!-- Фильтры по участникам -->
    <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-2xl border border-slate-800 text-xs">
      <span class="text-slate-400 font-bold px-2">Фильтр:</span>
      <div class="flex gap-1">
        <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-xl font-bold bg-amber-500 text-slate-950 transition">Все</button>
        <button onclick="setFilter('Виталий')" id="filter-Виталий" class="px-3 py-1.5 rounded-xl font-bold text-slate-400 hover:text-white transition">Виталий</button>
        <button onclick="setFilter('Дмитрий')" id="filter-Дмитрий" class="px-3 py-1.5 rounded-xl font-bold text-slate-400 hover:text-white transition">Дмитрий</button>
        <button onclick="setFilter('Ринат')" id="filter-Ринат" class="px-3 py-1.5 rounded-xl font-bold text-slate-400 hover:text-white transition">Ринат</button>
      </div>
    </div>

    <!-- Общий Рейтинг -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-black text-amber-400 uppercase tracking-widest flex items-center gap-2">
          <span>🏆</span> Главный Рейтинг Заведений
        </h2>
        <span id="totalVenuesCount" class="text-xs text-slate-500 font-bold"></span>
      </div>

      <div id="loading" class="text-center text-xs text-emerald-400 font-bold py-8">Загрузка рейтинга...</div>
      <div id="venuesList" class="space-y-4"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wvfiqnfdqxdvrggexuqk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A5kX8Yq_KtoSJcwd4brj0g_8ipJxn_O";
    
    // Используем уникальное имя переменной, чтобы избежать конфликтов
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allData = [];
    let activeFilter = 'all';

    function setFilter(author) {
      activeFilter = author;
      ['all', 'Виталий', 'Дмитрий', 'Ринат'].forEach(a => {
        const btn = document.getElementById(`filter-${a}`);
        if (btn) {
          if (a === author) {
            btn.className = "px-3 py-1.5 rounded-xl font-bold bg-amber-500 text-slate-950 transition shadow";
          } else {
            btn.className = "px-3 py-1.5 rounded-xl font-bold text-slate-400 hover:text-white transition";
          }
        }
      });
      renderList();
    }

    async function loadReviews() {
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.display = 'block';

      try {
        const { data, error } = await dbClient.from('reviews').select('*').order('created_at', { ascending: false });
        if (loadingEl) loadingEl.style.display = 'none';

        if (error) {
          document.getElementById('venuesList').innerHTML = `<p class="text-xs text-red-400 text-center p-4 bg-slate-900 rounded-2xl">Ошибка базы: ${error.message}</p>`;
          return;
        }

        allData = data || [];
        renderList();
      } catch (err) {
        if (loadingEl) loadingEl.style.display = 'none';
        document.getElementById('venuesList').innerHTML = `<p class="text-xs text-red-400 text-center p-4 bg-slate-900 rounded-2xl">Сбой соединения: ${err.message}</p>`;
      }
    }

    function renderList() {
      const listEl = document.getElementById('venuesList');
      if (!listEl) return;
      listEl.innerHTML = '';

      let filtered = allData;
      if (activeFilter !== 'all') {
        filtered = allData.filter(r => r.author === activeFilter);
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-slate-900/60 border border-emerald-900/40 p-8 rounded-3xl text-center text-xs text-slate-400">Оценок пока нет. Заполните форму выше и добавьте первую точку!</div>`;
        document.getElementById('totalVenuesCount').textContent = `Заведений: 0`;
        return;
      }

      const grouped = {};
      filtered.forEach(r => {
        const key = (r.venue_name || 'Без названия').trim();
        if (!grouped[key]) {
          grouped[key] = { name: key, reviews: [] };
        }
        grouped[key].reviews.push(r);
      });

      const ranked = Object.values(grouped).map(v => {
        let shawaSum = 0, shawaCount = 0;
        let beerSum = 0, beerCount = 0;

        v.reviews.forEach(r => {
          if (r.shawa_taste != null) { shawaSum += Number(r.shawa_taste); shawaCount++; }
          if (r.beer_taste != null) { beerSum += Number(r.beer_taste); beerCount++; }
        });

        const avgShawa = shawaCount ? (shawaSum / shawaCount) : 0;
        const avgBeer = beerCount ? (beerSum / beerCount) : 0;
        const overall = (avgShawa && avgBeer) ? ((avgShawa + avgBeer) / 2) : (avgShawa || avgBeer || 0);

        return { ...v, avgShawa, avgBeer, overall };
      }).sort((a, b) => b.overall - a.overall);

      document.getElementById('totalVenuesCount').textContent = `Заведений: ${ranked.length}`;

      ranked.forEach((v, idx) => {
        const div = document.createElement('div');
        div.className = "bg-slate-900/90 border border-emerald-800/50 p-5 rounded-3xl shadow-xl space-y-3.5 relative overflow-hidden";
        
        const crown = idx === 0 ? '👑' : `#${idx + 1}`;
        const badgeColor = idx === 0 ? 'bg-amber-500 text-slate-950 border-amber-300' : 'bg-slate-800 text-slate-300 border-slate-700';

        let reviewsHtml = v.reviews.map(r => {
          const commentParts = (r.comment || '').split('|');
          const beerTitle = commentParts[0] ? commentParts[0].trim() : 'Пиво';
          const userComment = commentParts[1] ? commentParts[1].trim() : (r.comment || '');

          return `
            <div class="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 text-xs space-y-1.5">
              <div class="flex justify-between items-center font-bold">
                <span class="text-amber-400 font-extrabold">${r.author || 'Участник'}</span>
                <span class="text-[10px] text-slate-500">${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</span>
              </div>
              
              <div class="grid grid-cols-2 gap-2 pt-1 text-[11px] font-semibold">
                <div class="bg-emerald-950/40 p-1.5 rounded-xl border border-emerald-900/40">🌯 ${r.city || 'Шаурма'}: <b class="text-emerald-400 font-bold">${r.shawa_taste ?? '-'}</b></div>
                <div class="bg-amber-950/30 p-1.5 rounded-xl border border-amber-900/30">🍺 ${beerTitle}: <b class="text-amber-400 font-bold">${r.beer_taste ?? '-'}</b></div>
              </div>

              ${userComment && userComment !== beerTitle ? `<div class="text-[11px] text-slate-300 italic pt-1">«${userComment}»</div>` : ''}
            </div>
          `;
        }).join('');

        div.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
            <div class="flex items-center gap-3">
              <span class="w-9 h-9 rounded-2xl ${badgeColor} font-black flex items-center justify-center text-sm border shadow">${crown}</span>
              <div>
                <h3 class="font-black text-lg text-slate-100">${v.name}</h3>
                <div class="text-[11px] text-slate-400 font-medium">Оценок: ${v.reviews.length}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-amber-400">${v.overall.toFixed(1)}</div>
              <div class="text-[9px] text-slate-500 uppercase font-black tracking-wider">Общий балл</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 bg-slate-950/70 p-3 rounded-2xl border border-slate-800/80 text-xs text-center font-black">
            <div class="text-slate-300">🌯 Шаурма: <span class="text-emerald-400 ml-1">${v.avgShawa ? v.avgShawa.toFixed(1) : '-'}</span></div>
            <div class="text-slate-300">🍺 Пиво: <span class="text-amber-400 ml-1">${v.avgBeer ? v.avgBeer.toFixed(1) : '-'}</span></div>
          </div>

          <div class="space-y-2 pt-1">
            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Отзывы участников:</div>
            ${reviewsHtml}
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    document.getElementById('shavaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('formStatus');
      btn.textContent = 'Сохранение...';
      statusEl.textContent = '';

      const name = document.getElementById('venueName').value;
      const author = document.getElementById('venueAuthor').value;
      
      const shawaName = document.getElementById('shawaName').value;
      const shawaScore = document.getElementById('shawaScore').value;
      
      const beerName = document.getElementById('beerName').value;
      const beerScore = document.getElementById('beerScore').value;
      
      const comment = document.getElementById('venueComment').value;

      if (!name) {
        alert('Укажите название заведения!');
        btn.textContent = 'Сохранить оценку в облако';
        return;
      }

      try {
        const { error } = await dbClient.from('reviews').insert([{
          venue_name: name,
          author: author,
          city: shawaName || 'Классика', 
          shawa_taste: shawaScore ? Number(shawaScore) : null,
          beer_taste: beerScore ? Number(beerScore) : null,
          comment: `${beerName || 'Разливное'} | ${comment || ''}`
        }]);

        if (error) {
          status_el_class = "text-center font-bold text-xs text-red-400";
          statusEl.className = status_el_class;
          statusEl.textContent = 'Ошибка сохранения: ' + error.message;
          btn.textContent = 'Сохранить оценку в облако';
        } else {
          statusEl.className = "text-center font-bold text-xs text-emerald-400";
          statusEl.textContent = '✅ Успешно! Информация передана в облако';
          
          document.getElementById('venueName').value = '';
          document.getElementById('shawaName').value = '';
          document.getElementById('beerName').value = '';
          document.getElementById('venueComment').value = '';
          
          loadReviews();
          btn.textContent = 'Сохранить оценку в облако';

          setTimeout(() => { 
            statusEl.textContent = ''; 
          }, 4000);
        }
      } catch (err) {
        statusEl.className = "text-center font-bold text-xs text-red-400";
        statusEl.textContent = 'Ошибка выполнения: ' + err.message;
        btn.textContent = 'Сохранить оценку в облако';
      }
    });

    loadReviews();
  </script>
</body>
</html>
