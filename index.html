<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШАВАЛИГА — Закрытый клубный рейтинг</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0F291E] text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE СЮДА:
    const SUPABASE_URL = "HTTPS://YOUR-PROJECT.SUPABASE.CO";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";
    
    const supabase = supabaseClient.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [activeTab, setActiveTab] = useState('ratings');
      const [currentUser, setCurrentUser] = useState('Виталий');
      const [reviews, setReviews] = useState([]);
      const [loading, setLoading] = useState(true);

      // Форма добавления
      const [showModal, setShowModal] = useState(false);
      const [venueName, setVenueName] = useState('');
      const [address, setAddress] = useState('');
      const [city, setCity] = useState('Минск');
      const [shawaScore, setShawaScore] = useState(8);
      const [beerScore, setBeerScore] = useState(8);
      const [placeScore, setPlaceScore] = useState(8);
      const [comment, setComment] = useState('');

      const fetchReviews = async () => {
        setLoading(true);
        const { data, error } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
        if (!error && data) {
          setReviews(data);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchReviews();
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!venueName) return;

        const newEntry = {
          venue_name: venueName,
          address: address,
          city: city,
          author: currentUser,
          shawa_taste: Number(shawaScore),
          beer_taste: Number(beerScore),
          place_overall: Number(placeScore),
          comment: comment
        };

        const { error } = await supabase.from('reviews').insert([newEntry]);
        if (!error) {
          setShowModal(false);
          setVenueName('');
          setAddress('');
          setComment('');
          fetchReviews();
        } else {
          alert('Ошибка при сохранении: ' + error.message);
        }
      };

      return (
        <div className="min-h-screen bg-[#0F291E] text-slate-100 font-sans pb-12">
          {/* Header */}
          <header className="bg-slate-900/90 border-b border-emerald-800/40 sticky top-0 z-30 backdrop-blur-md">
            <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                  🌯
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-wider text-amber-400">ШАВАЛИГА</h1>
                  <p className="text-emerald-300/70 text-xs italic">«Каждый вторник — новая проверка»</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex bg-slate-950 p-1.5 rounded-xl border border-emerald-900/60 text-xs gap-1">
                  <button onClick={() => setActiveTab('ratings')} className={`px-3 py-2 rounded-lg font-bold transition ${activeTab === 'ratings' ? 'bg-emerald-700 text-white shadow' : 'text-slate-400'}`}>🏆 Рейтинги</button>
                  <button onClick={() => setActiveTab('history')} className={`px-3 py-2 rounded-lg font-bold transition ${activeTab === 'history' ? 'bg-emerald-700 text-white shadow' : 'text-slate-400'}`}>📅 Вторники</button>
                </div>

                <button 
                  onClick={() => setShowModal(true)}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs shadow-lg transition transform active:scale-95"
                >
                  + Оценить заведение
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 mt-6 space-y-6">
            {/* Статистика */}
            <section className="grid grid-cols-3 gap-4">
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl text-center">
                <div className="text-xs text-emerald-400 uppercase font-bold">Оценок в базе</div>
                <div className="text-3xl font-black text-amber-400 mt-1">{reviews.length}</div>
              </div>
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl text-center">
                <div className="text-xs text-emerald-400 uppercase font-bold">Валюта</div>
                <div className="text-3xl font-black text-slate-100 mt-1">BYN</div>
              </div>
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl text-center">
                <div className="text-xs text-emerald-400 uppercase font-bold">Участник</div>
                <select value={currentUser} onChange={e => setCurrentUser(e.target.value)} className="bg-slate-950 border border-slate-800 text-amber-400 font-bold text-xs p-1 mt-1 rounded outline-none">
                  <option>Виталий</option>
                  <option>Алексей</option>
                  <option>Дмитрий</option>
                  <option>Павел</option>
                </select>
              </div>
            </section>

            {/* Загрузка / Карточки */}
            {loading ? (
              <div className="text-center py-12 text-emerald-400">Загрузка данных из облака...</div>
            ) : activeTab === 'ratings' ? (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {reviews.length === 0 ? (
                  <div className="col-span-2 text-center py-12 text-slate-400">База пока пуста. Нажми «+ Оценить заведение», чтобы добавить Дейзи или Пивную!</div>
                ) : (
                  reviews.map((r) => {
                    const avg = ((Number(r.shawa_taste || 0) + Number(r.beer_taste || 0) + Number(r.place_overall || 0)) / 3).toFixed(1);
                    return (
                      <div key={r.id} className="bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-5 shadow-xl">
                        <div className="flex justify-between items-start mb-2">
                          <span className="bg-emerald-950 text-emerald-300 border border-emerald-600/30 text-xs px-2.5 py-1 rounded-lg font-bold">
                            {r.city}
                          </span>
                          <span className="text-xs text-slate-400">Автор: <b className="text-amber-400">{r.author}</b></span>
                        </div>
                        <h3 className="text-lg font-black text-slate-100 mb-1">{r.venue_name}</h3>
                        <p className="text-xs text-slate-400 mb-4">{r.address || 'Адрес не указан'}</p>
                        
                        <div className="grid grid-cols-3 gap-2 bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs text-center mb-3">
                          <div>
                            <div className="text-slate-400">Шаурма</div>
                            <div className="font-bold text-amber-400">{r.shawa_taste || '-'}</div>
                          </div>
                          <div>
                            <div className="text-slate-400">Пиво</div>
                            <div className="font-bold text-amber-400">{r.beer_taste || '-'}</div>
                          </div>
                          <div>
                            <div className="text-slate-400">Атмосфера</div>
                            <div className="font-bold text-amber-400">{r.place_overall || '-'}</div>
                          </div>
                        </div>

                        {r.comment && <p className="text-xs text-slate-300 italic mb-4">«{r.comment}»</p>}

                        <div className="pt-3 border-t border-slate-800 flex justify-between items-center">
                          <span className="text-[10px] text-slate-500">{new Date(r.created_at).toLocaleDateString()}</span>
                          <div className="text-right">
                            <span className="text-2xl font-black text-emerald-400">{avg}</span>
                            <span className="text-[10px] text-slate-500"> / 10</span>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            ) : (
              <div className="bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 className="text-xl font-black text-amber-400">История визитов</h2>
                {reviews.map((r) => (
                  <div key={r.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                      <div className="font-bold text-slate-100">{r.venue_name} ({r.city})</div>
                      <div className="text-xs text-slate-400">Оценил: {r.author} • {r.comment}</div>
                    </div>
                    <div className="text-amber-400 font-bold text-lg">
                      {((Number(r.shawa_taste || 0) + Number(r.beer_taste || 0) + Number(r.place_overall || 0)) / 3).toFixed(1)}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Модальное окно добавления */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-emerald-500/40 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-black text-amber-400">Оценить заведение</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Название заведения</label>
                    <input 
                      type="text" 
                      value={venueName} 
                      onChange={e => setVenueName(e.target.value)}
                      placeholder="Например: Дейзи или Шаурма в Пивне" 
                      className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 outline-none focus:border-amber-400"
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Адрес / Описание места</label>
                    <input 
                      type="text" 
                      value={address} 
                      onChange={e => setAddress(e.target.value)}
                      placeholder="Например: ул. Максима Танка" 
                      className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 outline-none focus:border-amber-400"
                    />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Шава (1-10)</label>
                      <input type="number" min="1" max="10" value={shawaScore} onChange={e => setShawaScore(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Пиво (1-10)</label>
                      <input type="number" min="1" max="10" value={beerScore} onChange={e => setBeerScore(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Вайб (1-10)</label>
                      <input type="number" min="1" max="10" value={placeScore} onChange={e => setPlaceScore(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Комментарий вторника</label>
                    <textarea 
                      value={comment} 
                      onChange={e => setComment(e.target.value)}
                      placeholder="Соус, мяско, прожарка лаваша..." 
                      className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 h-20 outline-none resize-none"
                    ></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl">Отмена</button>
                    <button type="submit" className="px-5 py-2 bg-amber-500 text-slate-950 font-extrabold rounded-xl">Сохранить в облако</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
