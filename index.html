<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШАВАЛИГА</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F291E] text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-xl mx-auto space-y-6">
    
    <header class="text-center py-6 border-b border-emerald-800">
      <h1 class="text-3xl font-black text-amber-400">ШАВАЛИГА</h1>
      <p class="text-emerald-300 text-xs italic mt-1">«Каждый вторник — новая проверка»</p>
    </header>

    <!-- Форма добавления -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-emerald-800/60 shadow-xl space-y-4">
      <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">Добавить заведение</h2>
      <form id="shavaForm" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1 font-bold">Название (Дейзи / Пивная на М. Танка)</label>
          <input type="text" id="venueName" placeholder="Введите название..." class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-slate-100 outline-none focus:border-amber-400" required />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Оценка (1-10)</label>
            <input type="number" id="venueScore" min="1" max="10" value="9" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-slate-100 text-center font-bold text-amber-400" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-bold">Кто оценивает</label>
            <select id="venueAuthor" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-slate-100 outline-none">
              <option>Виталий</option>
              <option>Алексей</option>
              <option>Дмитрий</option>
              <option>Павел</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-bold">Комментарий</label>
          <input type="text" id="venueComment" placeholder="Соус, лаваш, пиво..." class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-slate-100 outline-none" />
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition shadow-lg">
          Сохранить в облако
        </button>
      </form>
    </div>

    <!-- Список -->
    <div class="space-y-3">
      <h2 class="text-sm font-bold text-emerald-300 uppercase tracking-wider">Список заведений</h2>
      <div id="loading" class="text-center text-xs text-slate-400 py-4">Загрузка из базы...</div>
      <div id="venuesList" class="space-y-3"></div>
    </div>

  </div>

  <!-- Подключаем Supabase скрипт -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wvfiqnfdqxdvrggexuqk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A5kX8Yq_KtoSJcwd4brj0g_8ipJxn_O";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadReviews() {
      const listEl = document.getElementById('venuesList');
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';

      const { data, error } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
      loadingEl.style.display = 'none';
      listEl.innerHTML = '';

      if (error) {
        listEl.innerHTML = `<p class="text-xs text-red-400 text-center">Ошибка загрузки: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<div class="bg-slate-900 border border-emerald-900 p-4 rounded-xl text-center text-xs text-slate-400">База пока пуста. Добавьте Дейзи или Пивную через форму выше!</div>`;
        return;
      }

      data.forEach(r => {
        const div = document.createElement('div');
        div.className = "bg-slate-900 border border-emerald-900/60 p-4 rounded-xl flex justify-between items-center shadow-lg";
        div.innerHTML = `
          <div>
            <div class="font-black text-slate-100 text-base">${r.venue_name}</div>
            <div class="text-xs text-slate-400 mt-0.5">${r.comment || 'Без комментария'} <span class="text-emerald-400">• ${r.author}</span></div>
          </div>
          <div class="text-2xl font-black text-amber-400">${r.shawa_taste || '-'} <span class="text-xs text-slate-500">/10</span></div>
        `;
        listEl.appendChild(div);
      });
    }

    document.getElementById('shavaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Сохранение...';

      const name = document.getElementById('venueName').value;
      const score = Number(document.getElementById('venueScore').value);
      const author = document.getElementById('venueAuthor').value;
      const comment = document.getElementById('venueComment').value;

      const { error } = await supabase.from('reviews').insert([{
        venue_name: name,
        shawa_taste: score,
        author: author,
        comment: comment
      }]);

      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        document.getElementById('venueName').value = '';
        document.getElementById('venueComment').value = '';
        loadReviews();
      }
      btn.textContent = 'Сохранить в облако';
    });

    loadReviews();
  </script>
</body>
</html>
