<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШАВАЛИГА — Закрытый клубный рейтинг</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0F291E] text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('ratings');
      const [ratingSubTab, setRatingSubTab] = useState('all');
      const [currentUser, setCurrentUser] = useState('Виталий');
      const [isPrivateClub, setIsPrivateClub] = useState(true);

      const members = [
        { name: 'Виталий', role: 'Основатель & КД', avatar: '🥩' },
        { name: 'Алексей', role: 'Эксперт по соусам', avatar: '🍺' },
        { name: 'Дмитрий', role: 'Критик лаваша', avatar: '🌯' },
        { name: 'Павел', role: 'Дегустатор пива', avatar: '🍻' },
      ];

      const [venues, setVenues] = useState([
        {
          id: 1,
          name: 'Шаурма в Раковском',
          city: 'Минск',
          address: 'ул. Раковская, 25',
          visitsCount: 5,
          scores: { overall: 9.3, shawa: 9.5, beer: 8.9, place: 9.0 },
          lastVisit: '04.11.2026',
          comment: 'Идеальный хрустящий лаваш и фирменный чесночный соус.',
          badge: 'Шава вторника 🏆'
        },
        {
          id: 2,
          name: 'Grodno Shava Bar',
          city: 'Гродно',
          address: 'Советская, 12',
          visitsCount: 2,
          scores: { overall: 9.0, shawa: 9.2, beer: 9.1, place: 8.7 },
          lastVisit: '03.08.2026',
          comment: 'Отличная атмосфера старого города и темное разливное.',
          badge: 'Пиво вторника 🍺'
        },
        {
          id: 3,
          name: 'Draft & Roll',
          city: 'Минск',
          address: 'пр. Победителей, 9',
          visitsCount: 8,
          scores: { overall: 8.4, shawa: 8.0, beer: 9.4, place: 8.0 },
          lastVisit: '27.10.2026',
          comment: 'Пиво шикарное, шаверма средняя.',
          badge: 'Самое спорное ⚖️'
        }
      ]);

      const [visitsHistory, setVisitsHistory] = useState([
        {
          date: '04.11.2026',
          venue: 'Шаурма в Раковском',
          participants: ['Виталий', 'Алексей', 'Дмитрий', 'Павел'],
          items: 'Фирменная шаурма + светлое нефильтрованное',
          avgScore: 9.3,
          comment: 'Вторник удался на славу!'
        },
        {
          date: '27.10.2026',
          venue: 'Draft & Roll',
          participants: ['Виталий', 'Павел'],
          items: 'Острая шаверма + IPA',
          avgScore: 8.4,
          comment: 'Мясо было чуть суховатенькое, но пиво спасло вечер.'
        }
      ]);

      const [showAddModal, setShowAddModal] = useState(false);
      const [newVenueName, setNewVenueName] = useState('');
      const [newCity, setNewCity] = useState('Минск');
      const [newScore, setNewScore] = useState(9);
      const [newComment, setNewComment] = useState('');

      const handleAddVenue = (e) => {
        e.preventDefault();
        if (!newVenueName) return;
        const newItem = {
          id: Date.now(),
          name: newVenueName,
          city: newCity,
          address: 'ул. Главная, 1',
          visitsCount: 1,
          scores: { overall: Number(newScore), shawa: Number(newScore), beer: 8.5, place: 9.0 },
          lastVisit: 'Сегодня',
          comment: newComment || 'Новая точка на карте вторников.',
          badge: 'Новичок 🚀'
        };
        setVenues([newItem, ...venues]);
        setShowAddModal(false);
        setNewVenueName('');
        setNewComment('');
      };

      return (
        <div className="min-h-screen bg-[#0F291E] text-slate-100 font-sans pb-12">
          {/* Header */}
          <header className="bg-slate-900/90 border-b border-emerald-800/40 sticky top-0 z-30 backdrop-blur-md">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                  🌯
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-wider text-amber-400">ШАВАЛИГА</h1>
                  <p className="text-emerald-300/70 text-xs italic">«Каждый вторник — новая проверка»</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex bg-slate-950 p-1.5 rounded-xl border border-emerald-900/60 text-xs gap-1">
                <button 
                  onClick={() => setActiveTab('ratings')}
                  className={`px-3 py-2 rounded-lg font-bold transition ${activeTab === 'ratings' ? 'bg-emerald-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  🏆 Рейтинги
                </button>
                <button 
                  onClick={() => setActiveTab('history')}
                  className={`px-3 py-2 rounded-lg font-bold transition ${activeTab === 'history' ? 'bg-emerald-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📅 Наши Вторники
                </button>
                <button 
                  onClick={() => setActiveTab('cabinet')}
                  className={`px-3 py-2 rounded-lg font-bold transition ${activeTab === 'cabinet' ? 'bg-emerald-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  👤 Клуб ({currentUser})
                </button>
              </div>

              {/* Actions & Club Mode */}
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setShowAddModal(true)}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs shadow-lg transition transform active:scale-95"
                >
                  + Оценить заведение
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 mt-6 space-y-6">
            
            {/* Quick Stats bar */}
            <section className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl">
                <div className="text-xs text-emerald-400 uppercase font-bold tracking-wider">Заведений в базе</div>
                <div className="text-3xl font-black text-amber-400 mt-1">{venues.length}</div>
              </div>
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl">
                <div className="text-xs text-emerald-400 uppercase font-bold tracking-wider">Всего оценок</div>
                <div className="text-3xl font-black text-amber-400 mt-1">48</div>
              </div>
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl">
                <div className="text-xs text-emerald-400 uppercase font-bold tracking-wider">Участников клуба</div>
                <div className="text-3xl font-black text-amber-400 mt-1">4</div>
              </div>
              <div className="bg-slate-900/80 p-4 rounded-2xl border border-emerald-500/20 shadow-xl">
                <div className="text-xs text-amber-400 uppercase font-bold tracking-wider">Валюта клуба</div>
                <div className="text-3xl font-black text-slate-100 mt-1">BYN</div>
              </div>
            </section>

            {/* TAB 1: RATINGS */}
            {activeTab === 'ratings' && (
              <div className="space-y-6">
                <div className="flex flex-wrap justify-between items-center gap-4 bg-slate-900/80 p-4 rounded-2xl border border-emerald-800/40">
                  <h2 className="text-xl font-black text-amber-400">Таблица лидеров</h2>
                  <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    {[
                      { id: 'all', label: 'Общий рейтинг' },
                      { id: 'shawa', label: 'Шаверма' },
                      { id: 'beer', label: 'Пиво' },
                      { id: 'anti', label: 'Антирейтинг' }
                    ].map(sub => (
                      <button
                        key={sub.id}
                        onClick={() => setRatingSubTab(sub.id)}
                        className={`px-3 py-1.5 rounded-lg font-bold transition ${ratingSubTab === sub.id ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}
                      >
                        {sub.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {venues.map((v, idx) => (
                    <div key={v.id} className="bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-5 shadow-xl flex flex-col justify-between hover:border-amber-500/50 transition">
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <span className="bg-emerald-950 text-emerald-300 border border-emerald-600/30 text-xs px-2.5 py-1 rounded-lg font-bold">
                            {v.city}
                          </span>
                          <span className="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-lg font-bold">
                            {v.badge}
                          </span>
                        </div>
                        <h3 className="text-lg font-black text-slate-100 mb-1">{v.name}</h3>
                        <p className="text-xs text-slate-400 mb-4">{v.address}</p>
                        
                        <div className="space-y-2 mb-4 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs">
                          <div className="flex justify-between">
                            <span className="text-slate-400">Шаверма:</span>
                            <span className="font-bold text-amber-400">{v.scores.shawa} / 10</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Пиво:</span>
                            <span className="font-bold text-amber-400">{v.scores.beer} / 10</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Посещений:</span>
                            <span className="font-bold text-slate-200">{v.visitsCount}</span>
                          </div>
                        </div>

                        <p className="text-xs text-slate-300 italic mb-4">«{v.comment}»</p>
                      </div>

                      <div className="pt-4 border-t border-slate-800 flex justify-between items-center">
                        <span className="text-xs text-slate-400">Последний визит: {v.lastVisit}</span>
                        <div className="text-right">
                          <div className="text-2xl font-black text-emerald-400">{v.scores.overall}</div>
                          <div className="text-[10px] text-slate-500 uppercase">Средний балл</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: HISTORY */}
            {activeTab === 'history' && (
              <div className="bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-6 shadow-xl space-y-6">
                <h2 className="text-xl font-black text-amber-400">Хроника вторников</h2>
                <div className="space-y-4">
                  {visitsHistory.map((h, idx) => (
                    <div key={idx} className="bg-slate-950/70 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between gap-4">
                      <div className="space-y-2">
                        <div className="flex items-center gap-3">
                          <span className="bg-emerald-800 text-white text-xs font-bold px-3 py-1 rounded-lg">{h.date}</span>
                          <h3 className="font-black text-lg text-slate-100">{h.venue}</h3>
                        </div>
                        <p className="text-xs text-slate-300"><span className="text-amber-400 font-bold">Пробовали:</span> {h.items}</p>
                        <p className="text-xs text-slate-400 italic">«{h.comment}»</p>
                        <div className="flex gap-2 pt-1">
                          {h.participants.map((p, i) => (
                            <span key={i} className="text-[10px] bg-slate-900 border border-slate-700 px-2 py-0.5 rounded text-slate-300">👤 {p}</span>
                          ))}
                        </div>
                      </div>
                      <div className="flex md:flex-col justify-between items-end border-t md:border-t-0 pt-3 md:pt-0 border-slate-800">
                        <span className="text-xs text-slate-400">Оценка выезда</span>
                        <div className="text-3xl font-black text-amber-400">{h.avgScore}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: CABINET */}
            {activeTab === 'cabinet' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-6 shadow-xl space-y-4">
                  <h2 className="text-lg font-black text-amber-400">Участники клуба</h2>
                  <div className="space-y-2">
                    {members.map((m, i) => (
                      <button
                        key={i}
                        onClick={() => setCurrentUser(m.name)}
                        className={`w-full flex items-center justify-between p-3 rounded-xl border transition ${currentUser === m.name ? 'bg-emerald-950 border-emerald-500 text-white' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-950'}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-2xl">{m.avatar}</span>
                          <div className="text-left">
                            <div className="font-bold">{m.name}</div>
                            <div className="text-[10px] text-emerald-400">{m.role}</div>
                          </div>
                        </div>
                        {currentUser === m.name && <span className="text-xs text-amber-400 font-bold">Активен</span>}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="md:col-span-2 bg-slate-900/90 border border-emerald-800/40 rounded-2xl p-6 shadow-xl space-y-4">
                  <h2 className="text-lg font-black text-amber-400">Профиль эксперта: {currentUser}</h2>
                  <div className="grid grid-cols-2 gap-4 text-sm">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-slate-400 text-xs">Строгость оценивания</div>
                      <div className="text-xl font-bold text-amber-400 mt-1">Умеренная (7.8 средняя)</div>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <div className="text-slate-400 text-xs">Любимая категория</div>
                      <div className="text-xl font-bold text-amber-400 mt-1">Хрустящий лаваш</div>
                    </div>
                  </div>
                  <div className="bg-emerald-950/40 p-4 rounded-xl border border-emerald-500/20 text-xs text-emerald-200">
                    💡 <span className="font-bold">Правило клуба:</span> Оценки выставляются независимо каждым участником сразу после вторничного рейда. Изменение оценок после публикации запрещено!
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Modal Add Venue */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-emerald-500/40 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-black text-amber-400">Оценить новое заведение</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <form onSubmit={handleAddVenue} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Название заведения</label>
                    <input 
                      type="text" 
                      value={newVenueName} 
                      onChange={e => setNewVenueName(e.target.value)}
                      placeholder="Например: Донер Кинг" 
                      className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 focus:border-amber-400 outline-none"
                      required 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Город</label>
                      <select 
                        value={newCity} 
                        onChange={e => setNewCity(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 focus:border-amber-400 outline-none"
                      >
                        <option>Минск</option>
                        <option>Гродно</option>
                        <option>
